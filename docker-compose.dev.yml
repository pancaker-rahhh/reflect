version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: feedbask_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedbask_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedbask_pass}
      POSTGRES_DB: ${POSTGRES_DB:-feedbask_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedbask_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: feedbask_postgres_data