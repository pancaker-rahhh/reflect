<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget Position Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .test-section {
        margin: 20px 0;
        padding: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        backdrop-filter: blur(10px);
      }
      .position-test {
        margin: 10px 0;
        padding: 10px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        cursor: pointer;
      }
      .position-test:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <h1>Widget Position Test</h1>
    <p>Click on a position to test the widget positioning:</p>

    <div class="test-section">
      <h3>Bottom Positions</h3>
      <div class="position-test" onclick="testPosition('bottom_right')">
        Bottom Right
      </div>
      <div class="position-test" onclick="testPosition('bottom_left')">
        Bottom Left
      </div>
    </div>

    <div class="test-section">
      <h3>Middle Positions</h3>
      <div class="position-test" onclick="testPosition('mid_right')">
        Middle Right
      </div>
      <div class="position-test" onclick="testPosition('mid_left')">
        Middle Left
      </div>
    </div>

    <div class="test-section">
      <h3>Current Position</h3>
      <div id="current-position">None</div>
    </div>

    <script>
      function testPosition(position) {
        // Remove existing widget
        const existingWidget = document.getElementById(
          "reflect-widget-container"
        );
        const existingLauncher = document.getElementById(
          "reflect-widget-launcher"
        );
        if (existingWidget) existingWidget.remove();
        if (existingLauncher) existingLauncher.remove();

        // Update config
        window.reflectConfig = {
          key: "widget_cfd8b6851f1d436e",
          position: position,
        };

        // Update display
        document.getElementById("current-position").textContent = position;

        // Reload widget script
        const script = document.createElement("script");
        script.src =
          "file:///Users/keshavrathinavel/Developer/reflect/client/dist-widget/widget.js";
        script.async = true;
        document.head.appendChild(script);
      }

      // Initialize with bottom_right
      testPosition("bottom_right");
    </script>
  </body>
</html>
