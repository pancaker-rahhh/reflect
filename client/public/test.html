<script>
  window.reflectConfig = { key: "widget_eee5d255e1bc48d8", position: "bottom_right" };
</script>
<!-- Reflect widget: non-blocking loader -->
<script>
(function() {
  function loadReflectWidget(){
    if (document.querySelector('script[data-reflect-widget]')) return;
    var s = document.createElement('script');
    s.src = 'https://cdn.reflectfeedback.com/widgets/widget_eee5d255e1bc48d8/widget.js';
    s.async = true;
    s.setAttribute('data-reflect-widget', '1');
    document.body.appendChild(s);
  }
  if (document.readyState === 'complete') {
    loadReflectWidget();
  } else {
    window.addEventListener('load', loadReflectWidget);
  }
})();
</script>
