name: Deploy to Fly.io

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set Fly.io secrets
        run: |
          # Database Configuration
          flyctl secrets set DATABASE_URL="${{ secrets.DATABASE_URL }}" --app ${{ secrets.FLY_APP_NAME }}
          
          # Supabase Configuration
          flyctl secrets set SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set SUPABASE_JWT_SECRET="${{ secrets.SUPABASE_JWT_SECRET }}" --app ${{ secrets.FLY_APP_NAME }}
          
          # Application Settings
          flyctl secrets set APP_NAME="${{ vars.APP_NAME }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set APP_VERSION="${{ vars.APP_VERSION }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set API_PREFIX="${{ vars.API_PREFIX }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set DEBUG="${{ vars.DEBUG }}" --app ${{ secrets.FLY_APP_NAME }}
          
          # Security
          flyctl secrets set SECRET_KEY="${{ secrets.SECRET_KEY }}" --app ${{ secrets.FLY_APP_NAME }}
          
          # Logging
          flyctl secrets set LOG_LEVEL="${{ secrets.LOG_LEVEL }}" --app ${{ secrets.FLY_APP_NAME }}
          
          # Cloudflare R2 Configuration
          flyctl secrets set R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set R2_BUCKET_NAME="${{ secrets.R2_BUCKET_NAME }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set CDN_BASE_URL="${{ secrets.CDN_BASE_URL }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set CDN_ZONE_ID="${{ secrets.CDN_ZONE_ID }}" --app ${{ secrets.FLY_APP_NAME }}
          flyctl secrets set CDN_API_TOKEN="${{ secrets.CDN_API_TOKEN }}" --app ${{ secrets.FLY_APP_NAME }}

      - name: Deploy to Fly.io
        working-directory: ./api
        run: flyctl deploy --remote-only --app ${{ secrets.FLY_APP_NAME }}