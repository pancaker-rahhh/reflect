name: Deploy to Development

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-to-dev.yaml"
  workflow_dispatch:

jobs:
  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Alembic upgrade head
        run: |
          set -Eeuo pipefail
          on_error() {
            echo "::error::Alembic migration failed at $(date -u)"
            echo "::group::Environment summary"
            python --version || true
            pip --version || true
            (alembic --version || true)
            echo "::endgroup::"
          }
          trap on_error ERR

          python -m pip install --upgrade pip
          pip install alembic==1.13.2 asyncpg==0.29.0 psycopg2-binary pydantic pydantic_settings sqlalchemy==2.0.23
          cd api/server

          # Convert to standard PostgreSQL URL with sslmode for psycopg2
          DB_URL="${{ secrets.DEV_DATABASE_URL }}"
          # Convert postgresql+asyncpg:// to postgresql:// and ssl=true to sslmode=require
          DB_URL="$(echo "$DB_URL" | sed -E 's|^postgresql\+asyncpg://|postgresql://|')"
          DB_URL="$(echo "$DB_URL" | sed -E 's|[?&]ssl=true|?sslmode=require|')"

          echo "::group::DB connection target"
          echo "Using DATABASE_URL: ${DB_URL%%:*}://***@$(echo \"$DB_URL\" | sed -E 's|^[^@]*@([^/:?]+).*|\1|')/$(echo \"$DB_URL\" | sed -E 's|.*/([^/?]+)(\?.*)?$|\1|')"
          echo "::endgroup::"

          echo "::group::Alembic current (before)"
          (DATABASE_URL="$DB_URL" ALEMBIC_MIGRATION=1 alembic current || true)
          echo "::endgroup::"

          DATABASE_URL="$DB_URL" ALEMBIC_MIGRATION=1 alembic upgrade head

          echo "::group::Alembic current (after)"
          DATABASE_URL="$DB_URL" ALEMBIC_MIGRATION=1 alembic current
          echo "::endgroup::"

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: migrate
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEV_GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east4-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            us-east4-docker.pkg.dev/reflect-dev-473413/reflectfeedback/app:latest 
            us-east4-docker.pkg.dev/reflect-dev-473413/reflectfeedback/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image details
        run: |
          echo "::notice::Image pushed to Artifact Registry"
          echo "::notice::Latest tag: us-east4-docker.pkg.dev/reflect-dev-473413/reflectfeedback/app:latest"
          echo "::notice::Commit tag: us-east4-docker.pkg.dev/reflect-dev-473413/reflectfeedback/app:${{ github.sha }}"

  deploy:
    name: Deploy to Cloud Run via Terraform
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    defaults:
      run:
        working-directory: ./infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DEV_GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Ensure Terraform state bucket exists
        run: |
          # Verify gcloud authentication
          gcloud auth list
          gcloud config set project ${{ secrets.DEV_GCP_PROJECT_ID }}

          if ! gsutil ls gs://reflectfeedback-dev-terraform-state &> /dev/null; then
            echo "Creating Terraform state bucket..."
            gsutil mb -p ${{ secrets.DEV_GCP_PROJECT_ID }} -l us-east4 gs://reflectfeedback-dev-terraform-state
            gsutil versioning set on gs://reflectfeedback-dev-terraform-state
            echo "::notice::Created Terraform state bucket"
          else
            echo "::notice::Terraform state bucket already exists"
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=reflectfeedback-dev-terraform-state"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file=environments/dev/terraform.tfvars -out=tfplan -no-color
          terraform show -no-color tfplan > plan.txt
          echo "::group::Terraform Plan"
          cat plan.txt
          echo "::endgroup::"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="image=us-east4-docker.pkg.dev/reflect-dev-473413/reflectfeedback/app:${{ github.sha }}" \
            tfplan

      - name: Get Service URL
        id: output
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "::notice::Service URL: $SERVICE_URL"

      - name: Show deployment summary
        run: |
          echo "::notice::Infrastructure deployed successfully via Terraform"
          echo "::notice::Service: reflectfeedback"
          echo "::notice::Region: us-east4"
          echo "::notice::Architecture: AMD64"
          echo "::notice::Image: ${{ secrets.DEV_DOCKER_IMAGE_TAG }}:latest"
