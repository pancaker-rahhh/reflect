name: Deploy to Development Enviroment

on:
 workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      api-image: ${{ steps.build-api.outputs.image }}
      web-image: ${{ steps.build-web.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: build-api
        run: |
          docker build -t $ECR_REGISTRY/reflect-api:latest ./api
          docker push $ECR_REGISTRY/reflect-api:latest
          echo "image=$ECR_REGISTRY/reflect-api:latest" >> $GITHUB_OUTPUT

      - name: Build and push Web image
        id: build-web
        run: |
          docker build -t $ECR_REGISTRY/reflect-web:latest ./client
          docker push $ECR_REGISTRY/reflect-web:latest
          echo "image=$ECR_REGISTRY/reflect-web:latest" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, pancaker]

    steps:
      - name: Clean workspace
        run: |
          sudo rm -rf ${{ github.workspace }}/*
          sudo rm -rf ${{ github.workspace }}/.[!.]*

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets. AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create .env file
        run: |
          cat > .env << EOF
          DEBUG=true
          ENV=development
          POSTGRES_USER=${{ secrets.POSTGRES_USER_DEV }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_DEV }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB_DEV }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT_DEV }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
          EOF

      - name: Deploy
        run: |
          docker compose down || true
          docker compose up -d

      - name: Cleanup
        run: docker image prune -f
