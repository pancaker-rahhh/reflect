name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  workflow_dispatch:

jobs:
  migrate:
    name: Run DB migrations (Neon)
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Alembic upgrade head
        run: |
          set -Eeuo pipefail
          on_error() {
            echo "::error::Alembic migration failed at $(date -u)"
            echo "::group::Environment summary"
            python --version || true
            pip --version || true
            (alembic --version || true)
            echo "::endgroup::"
          }
          trap on_error ERR

          python -m pip install --upgrade pip
          pip install alembic asyncpg psycopg2-binary pydantic pydantic_settings
          cd api/server

          DB_URL="${{ secrets.DATABASE_URL }}"          
          # Use sync driver for Alembic to avoid asyncpg param differences
          DB_URL="$(echo "$DB_URL" | sed -E 's|^postgres(ql)?\+asyncpg://|postgresql://|; s|^postgres(ql)?://|postgresql://|')"
          # Ensure Neon sslmode=require once
          DB_URL="$(echo "$DB_URL" | sed -E 's/([?&])ssl=true/\1sslmode=require/g')"
          if [[ "$DB_URL" != *"sslmode="* ]]; then
            if [[ "$DB_URL" == *"?"* ]]; then DB_URL="$DB_URL&sslmode=require"; else DB_URL="$DB_URL?sslmode=require"; fi
          fi

          echo "::group::DB connection target"
          echo "Using DATABASE_URL: ${DB_URL%%:*}://***@$(echo \"$DB_URL\" | sed -E 's|^[^@]*@([^/:?]+).*|\1|')/$(echo \"$DB_URL\" | sed -E 's|.*/([^/?]+)(\?.*)?$|\1|')"
          echo "::endgroup::"

          echo "::group::Alembic current (before)"
          (ALEMBIC_SYNC=1 DATABASE_URL="$DB_URL" alembic current || true)
          echo "::endgroup::"

          ALEMBIC_SYNC=1 DATABASE_URL="$DB_URL" alembic upgrade head

          echo "::group::Alembic current (after)"
          ALEMBIC_SYNC=1 DATABASE_URL="$DB_URL" alembic current
          echo "::endgroup::"

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: migrate
    environment: prod
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: railway up --service ${{ vars.RAILWAY_SERVICE_NAME }}
        working-directory: ./api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEPLOYMENT_TOKEN }}