name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: prod
    container: ghcr.io/railwayapp/cli:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12 for migration step
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run DB migrations (Neon) before deploy
        run: |
          set -Eeuo pipefail
          on_error() {
            echo "::error::Alembic migration failed at $(date -u)"
            echo "::group::Environment summary"
            python --version || true
            pip --version || true
            (alembic --version || true)
            echo "::endgroup::"
          }
          trap on_error ERR

          python -m pip install --upgrade pip
          pip install alembic asyncpg psycopg2-binary
          cd api/server

          DB_URL="${{ secrets.DATABASE_URL }}"
          # Normalize scheme once: postgres:// or postgresql:// -> postgresql+asyncpg://
          DB_URL="$(echo "$DB_URL" | sed -E 's|^postgres(ql)?://|postgresql+asyncpg://|')"

          if [[ "$DB_URL" != *"sslmode="* ]]; then
            if [[ "$DB_URL" == *"?"* ]]; then DB_URL="$DB_URL&sslmode=require"; else DB_URL="$DB_URL?sslmode=require"; fi
          fi

          echo "::group::DB connection target"
          echo "Using DATABASE_URL: ${DB_URL%%:*}://***@$(echo \"$DB_URL\" | sed -E 's|^[^@]*@([^/:?]+).*|\1|')/$(echo \"$DB_URL\" | sed -E 's|.*/([^/?]+)(\?.*)?$|\1|')"
          echo "::endgroup::"

          echo "::group::Alembic current (before)"
          (DATABASE_URL="$DB_URL" alembic current || true)
          echo "::endgroup::"

          DATABASE_URL="$DB_URL" alembic upgrade head

          echo "::group::Alembic current (after)"
          DATABASE_URL="$DB_URL" alembic current
          echo "::endgroup::"

      - name: Deploy to Railway
        run: railway up --service ${{ vars.RAILWAY_SERVICE_NAME }}
        working-directory: ./api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEPLOYMENT_TOKEN }}