name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-to-railway.yaml'
  workflow_dispatch:

jobs:
  migrate:
    name: Run DB migrations (Neon)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Alembic upgrade head
        run: |
          set -Eeuo pipefail
          on_error() {
            echo "::error::Alembic migration failed at $(date -u)"
            echo "::group::Environment summary"
            python --version || true
            pip --version || true
            (alembic --version || true)
            echo "::endgroup::"
          }
          trap on_error ERR

          python -m pip install --upgrade pip
          pip install alembic==1.13.2 asyncpg==0.29.0 psycopg2-binary pydantic pydantic_settings sqlalchemy==2.0.23
          cd api/server

          # Convert to standard PostgreSQL URL with sslmode for psycopg2
          DB_URL="${{ secrets.DEV_DATABASE_URL }}"
          # Convert postgresql+asyncpg:// to postgresql:// and ssl=true to sslmode=require
          DB_URL="$(echo "$DB_URL" | sed -E 's|^postgresql\+asyncpg://|postgresql://|')"
          DB_URL="$(echo "$DB_URL" | sed -E 's|[?&]ssl=true|?sslmode=require|')"
          
          echo "::group::DB connection target"
          echo "Using DATABASE_URL: ${DB_URL%%:*}://***@$(echo \"$DB_URL\" | sed -E 's|^[^@]*@([^/:?]+).*|\1|')/$(echo \"$DB_URL\" | sed -E 's|.*/([^/?]+)(\?.*)?$|\1|')"
          echo "::endgroup::"

          echo "::group::Alembic current (before)"
          (DATABASE_URL="$DB_URL" ALEMBIC_MIGRATION=1 alembic current || true)
          echo "::endgroup::"

          DATABASE_URL="$DB_URL" ALEMBIC_MIGRATION=1 alembic upgrade head

          echo "::group::Alembic current (after)"
          DATABASE_URL="$DB_URL" ALEMBIC_MIGRATION=1 alembic current
          echo "::endgroup::"

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: migrate
    environment: dev
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_NAME }}
        working-directory: ./api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEPLOYMENT_TOKEN }}