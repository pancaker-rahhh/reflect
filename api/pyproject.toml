[project]
name = "reflect-api"
version = "0.1.0"
description = "Reflect API - Feedback Management Platform"
authors = [
    {name = "Indira Kumar",email = "indirak@reflectfeedback.com"},
    {name = "Kameel",email = "skameel@reflectfeedback.com"},
    {name = "Keshav",email="keshavr@reflectfeedback.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.0,<3.0.0)",
    "asyncpg (>=0.29.0,<0.30.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "structlog (>=25.4.0,<26.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "httpx (>=0.27.0,<0.28.0)",
    "boto3 (>=1.40.18,<2.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "pyjwt (>=2.8.0,<3.0.0)",
    "email-validator (>=2.0.0,<3.0.0)",
    "aiohttp (>=3.9.0,<4.0.0)",
    "cryptography (>=41.0.0,<42.0.0)",    
    "dodopayments (>=1.0.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.10"

[tool.poetry.group.test.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
faker = "^22.0.0"
factory-boy = "^3.3.0"
freezegun = "^1.2.0"
aiosqlite = "^0.19.0"

[tool.ruff.format]
quote-style = 'single'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
