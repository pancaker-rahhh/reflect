# api/fly.toml
app = "reflect-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Since Dockerfile is in api/ folder
  build-target = ""

[env]
  PORT = "8000"
  PYTHONPATH = "/app"

[resources]
  memory_mb = 512
  cpu_count = 1

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[services.http_checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "5s"
  method = "get"
  path = "/api/v1/health"
  protocol = "http"
